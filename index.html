    <p class="closing-tag" data-t="closingTag"></p>
    <p class="closing-note" data-t="closing"></p>
  </section>

      <label class="field">
        <span data-t="fName"></span>
        <input name="name" maxlength="80" autocomplete="name" required>
      </label>
      <fieldset class="choice">
        <legend data-t="fAttend"></legend>
        <label><input type="radio" name="attending" value="yes" required><span data-t="fYes"></span></label>

      </fieldset>
      <div class="if-yes" hidden>
        <label class="field">
          <span data-t="fGuests"></span>
          <select name="guests">
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>

        </label>
        <label class="field">

      <button class="btn dark" type="submit" data-t="fSubmit"></button>
      <p class="rsvp-msg" role="status" aria-live="polite"></p>
    </form>
    <div class="rsvp-done" hidden>

      <button class="rsvp-edit" type="button" id="rsvpEdit" data-t="fEdit"></button>
